title: 成长之路
subtitle: 蜕变与成长
layout: false
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>成长之路 | 蜕变与成长</title>
  <meta name="description" content="记录成长的每一步">
  <meta name="theme-color" content="#0a0a0f">
  <style>
    /* ========== 基础重置 ========== */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0f;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                   'Microsoft YaHei', 'Hirino Sans GB', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ========== 背景层 ========== */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    .bg-item {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(20px) brightness(0.3);
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
    }
    .bg-item.active {
      opacity: 1;
    }

    /* ========== 边缘泛光 ========== */
    .edge-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      box-shadow: inset 0 0 200px rgba(var(--glow-color, 255, 200, 100), 0.15);
      transition: box-shadow 1.2s ease-in-out;
    }

    /* ========== 中央光带 ========== */
    .light-ribbon {
      position: fixed;
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      transform: translateX(-50%);
      z-index: 2;
      overflow: hidden;
    }
    .light-ribbon::before {
      content: '';
      position: absolute;
      left: 0;
      top: -100%;
      width: 100%;
      height: 200%;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(255, 255, 255, 0.4) 25%,
        rgba(255, 255, 255, 0.8) 50%,
        rgba(255, 255, 255, 0.4) 75%,
        transparent 100%
      );
      animation: ribbonFlow 4s linear infinite;
    }
    @keyframes ribbonFlow {
      0% { transform: translateY(0); }
      100% { transform: translateY(50%); }
    }

    /* ========== 主容器 ========== */
    .timeline-container {
      position: relative;
      z-index: 3;
      height: 100%;
      transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1);
    }

    /* ========== 事件区块 ========== */
    .event-section {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0 5vw;
    }

    /* ========== 事件内容布局（左右交替） ========== */
    .event-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1400px;
      gap: 4rem;
    }

    /* 奇数事件：文字在左，相册在右 */
    .event-section:nth-child(odd) .event-content {
      flex-direction: row;
    }
    .event-section:nth-child(odd) .event-text {
      text-align: left;
    }
    .event-section:nth-child(odd) .event-album {
      align-items: flex-end;
    }

    /* 偶数事件：文字在右，相册在左 */
    .event-section:nth-child(even) .event-content {
      flex-direction: row-reverse;
    }
    .event-section:nth-child(even) .event-text {
      text-align: right;
    }
    .event-section:nth-child(even) .event-album {
      align-items: flex-start;
    }

    /* ========== 文字区域 ========== */
    .event-text {
      flex: 1;
      max-width: 45%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .event-period {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .event-title {
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 700;
      background: linear-gradient(135deg, #ffd700 0%, #ffb347 50%, #ff6b6b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }
    .event-mood {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.4);
      font-style: italic;
    }
    .event-body {
      font-size: clamp(0.9rem, 1.2vw, 1.1rem);
      line-height: 2;
      color: rgba(255, 255, 255, 0.75);
    }
    .event-body p {
      margin: 0.8em 0;
    }
    .event-achievement {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.3rem 1rem;
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 20px;
      font-size: 0.8rem;
      color: #ffd700;
    }

    /* ========== 相册区域 ========== */
    .event-album {
      flex: 1;
      max-width: 40%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* ========== 相册堆叠效果 ========== */
    .album-stack {
      position: relative;
      width: 280px;
      height: 200px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .album-stack:hover {
      transform: scale(1.05);
    }
    .album-stack:hover .album-thumb:nth-child(1) {
      transform: rotate(-8deg) translate(-15px, -5px);
    }
    .album-stack:hover .album-thumb:nth-child(2) {
      transform: rotate(0deg) translate(0, 0);
    }
    .album-stack:hover .album-thumb:nth-child(3) {
      transform: rotate(8deg) translate(15px, 5px);
    }
    .album-thumb {
      position: absolute;
      width: 260px;
      height: 180px;
      border-radius: 12px;
      background-size: cover;
      background-position: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: 2px solid rgba(255, 255, 255, 0.1);
    }
    .album-thumb:nth-child(1) {
      transform: rotate(-3deg) translate(-5px, -3px);
      z-index: 3;
    }
    .album-thumb:nth-child(2) {
      transform: rotate(2deg) translate(5px, 3px);
      z-index: 2;
      opacity: 0.8;
    }
    .album-thumb:nth-child(3) {
      transform: rotate(-1deg) translate(0, 6px);
      z-index: 1;
      opacity: 0.6;
    }
    .album-count {
      position: absolute;
      bottom: -25px;
      right: 0;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.4);
    }

    /* 无媒体时的占位 */
    .album-placeholder {
      width: 280px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: 2px dashed rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.9rem;
    }

    /* ========== 流星Canvas（无图片事件时使用） ========== */
    .meteor-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .meteor-canvas.active {
      opacity: 1;
    }

    /* ========== 相册弹层 ========== */
    .album-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(30px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .album-modal.open {
      opacity: 1;
      visibility: visible;
    }
    .album-modal-close {
      position: absolute;
      top: 2rem;
      right: 2rem;
      width: 48px;
      height: 48px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      transition: background 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .album-modal-close:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .album-modal-content {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: center;
      padding: 2rem;
      max-width: 90vw;
      max-height: 80vh;
      overflow-y: auto;
    }
    .album-modal-item {
      width: 300px;
      height: 220px;
      border-radius: 12px;
      background-size: cover;
      background-position: center;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .album-modal-item:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 255, 255, 0.1);
    }

    /* ========== 大图弹层 ========== */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      z-index: 101;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .lightbox-modal.open {
      opacity: 1;
      visibility: visible;
    }
    .lightbox-modal img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 0 60px rgba(255, 255, 255, 0.1);
    }
    .lightbox-modal-close {
      position: absolute;
      top: 2rem;
      right: 2rem;
      width: 48px;
      height: 48px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      transition: background 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ========== 视频弹层 ========== */
    .video-modal {
      position: fixed;
      inset: 0;
      z-index: 101;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .video-modal.open {
      opacity: 1;
      visibility: visible;
    }
    .video-modal video {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 8px;
    }
    .video-modal-close {
      position: absolute;
      top: 2rem;
      right: 2rem;
      width: 48px;
      height: 48px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      transition: background 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ========== 进度指示器 ========== */
    .progress-dots {
      position: fixed;
      right: 2rem;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .progress-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: all 0.4s ease;
    }
    .progress-dot.active {
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      transform: scale(1.4);
    }

    /* ========== 加载状态 ========== */
    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    .loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .loading-title {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffd700, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .loading-bar {
      width: 200px;
      height: 2px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 1px;
      overflow: hidden;
    }
    .loading-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffd700, #ff6b6b);
      transition: width 0.3s ease;
    }

    /* ========== 响应式 ========== */
    @media (max-width: 768px) {
      .event-content {
        flex-direction: column !important;
        gap: 2rem;
        padding: 2rem 1rem;
      }
      .event-text, .event-album {
        max-width: 100%;
        text-align: center !important;
        align-items: center !important;
      }
      .event-text {
        text-align: center !important;
      }
      .album-stack {
        width: 240px;
        height: 170px;
      }
      .album-thumb {
        width: 220px;
        height: 150px;
      }
      .light-ribbon {
        display: none;
      }
      .progress-dots {
        right: 1rem;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <!-- 加载画面 -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-title">成长之路</div>
    <div class="loading-bar">
      <div class="loading-bar-fill" id="loadingBarFill"></div>
    </div>
  </div>

  <!-- 背景层 -->
  <div class="bg-layer" id="bgLayer"></div>

  <!-- 边缘泛光 -->
  <div class="edge-glow" id="edgeGlow"></div>

  <!-- 中央光带 -->
  <div class="light-ribbon"></div>

  <!-- 流星Canvas -->
  <canvas class="meteor-canvas" id="meteorCanvas"></canvas>

  <!-- 主时间轴容器 -->
  <main class="timeline-container" id="timelineContainer"></main>

  <!-- 进度指示器 -->
  <div class="progress-dots" id="progressDots"></div>

  <!-- 相册弹层 -->
  <div class="album-modal" id="albumModal">
    <button class="album-modal-close" id="albumModalClose">&times;</button>
    <div class="album-modal-content" id="albumModalContent"></div>
  </div>

  <!-- 大图弹层 -->
  <div class="lightbox-modal" id="lightboxModal">
    <button class="lightbox-modal-close" id="lightboxModalClose">&times;</button>
    <img id="lightboxImage" src="" alt="">
  </div>

  <!-- 视频弹层 -->
  <div class="video-modal" id="videoModal">
    <button class="video-modal-close" id="videoModalClose">&times;</button>
    <video id="videoPlayer" controls preload="none"></video>
  </div>

  <!-- 页面交互脚本 -->
  <script src="/js/birthday-gift.js"></script>
</body>
</html>
