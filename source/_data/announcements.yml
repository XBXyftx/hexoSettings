# 公告历史（最新一期必须放在最上方）
#
# 新增公告时：
# 1. 复制最上方的一整个条目并粘贴到文件顶部；
# 2. 修改 id、published_at 与正文；
# 3. 图片可选，但使用时必须填写 src、alt、width、height；
# 4. source_commit 可在提交后补记，不影响构建。
#
# 正文只使用结构化字段，不要嵌入 HTML：
# lead -> image -> title -> items -> paragraphs -> closing

- id: 2026-08-11-110941-xp-window-theme
  published_at: '2026-08-11T11:09:41+08:00'
  lead: 全站换装 Windows XP 复古窗口！
  image:
    src: /imgs/gifs/2.webp
    alt: 芋圆杰哥
    width: 426
    height: 240
  title: 今日更新：
  items:
    - 首页轮播与瀑布流卡片换上 XP 平面窗口：纯蓝标题栏、四色徽标、装饰按钮与硬阴影；鼠标悬浮卡片时窗口会像被“激活”一样点亮，触屏下则常亮、点按有下沉反馈。
    - 侧边栏的公告、最新文章、标签、归档、站点信息与文章目录全部改为深色 XP 窗口；作者卡保留原有的渐变蒙版与背景图，一动不动。
    - 文章正文换为统一的深色窗口配色，note 提示块、折叠块、按钮、选项卡、时间轴等标签插件全部完成适配，长时间阅读更护眼。
    - 修复轮播偶尔空白的问题：慢网或脚本加载失败时会先静态展示第一篇精选，恢复后自动开始轮播；目录高亮统一为 XP 蓝，部分复习文章浅色表格的文字也补齐了对比度。
  closing: 愿这扇复古的小窗口，能让你在翻文章时多一点会心一笑。✨

- id: 2026-08-06-101356-toc-toggle-group
